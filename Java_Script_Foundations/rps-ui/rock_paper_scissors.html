<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="rock_paper_scissors.js" defer></script>
    <link rel="stylesheet" href="rps.css">
</head>
<body>
    <div class="input-container">
        <div class="rounds-btn"><button id="no-of-rounds">Number of Rounds</button></div>
        <div class="choice-btn"><button id="choice">Make a Choice</button></div>
        <div class="result-btn"><button id="result">See Result</button></div>
    </div>
    <div class="output-container">
        <div class="choice-output">
            <h3>Your Choice</h3>
        </div>
        <div class="computer-choice-output">
            <h3>Computer's Choice</h3>
        </div>
        <div class="rounds-output">
            <h3>Rounds</h3>
        </div>
        <div class="result-output">
            <h3>Result</h3>
        </div>
    </div>
</body>
</html>
