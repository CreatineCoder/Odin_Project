<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="grids.css">
</head>
<body>
 <div class="grid-container">
    <div class="card">Item 1</div>
    <div class="card">Item 2</div>
    <div class="card">Item 3</div>
    <div class="card">Item 4</div>
    <div class="card">Item 5</div>
    <div class="card">Item 6</div> 
 </div> 

 <!-- shorthand template -->
 <div class="grid-container-2">
    <div class="card2">Item 1</div>
    <div class="card2">Item 2</div>
    <div class="card2">Item 3</div>
    <div class="card2">Item 4</div>
    <div class="card2">Item 5</div>
    <div class="card2">Item 6</div> 
    <div class="card2">Item 7</div>
 </div> 

<!-- grid positioning -->
 <div class="container">
  <div class="room" id="living-room">Living Room</div>
  <div class="room" id="kitchen">Kitchen</div>
  <div class="room" id="bedroom">Bedroom</div>
  <div class="room" id="bathroom">Bathroom</div>
  <div class="room" id="closet">Closet</div>
</div>

<!-- grid areas-->
 <div class="container1">
  <div class="room1" id="living-room1">Living Room</div>
  <div class="room1" id="kitchen1">Kitchen</div>
  <div class="room1" id="bedroom1">Bedroom</div>
  <div class="room1" id="bathroom1">Bathroom</div>
  <div class="room1" id="closet1">Closet</div>
</div>

</body>
</html>
